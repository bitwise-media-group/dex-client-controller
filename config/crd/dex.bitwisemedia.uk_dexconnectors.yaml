---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: dexconnectors.dex.bitwisemedia.uk
spec:
  group: dex.bitwisemedia.uk
  names:
    categories:
    - dex
    kind: DexConnector
    listKind: DexConnectorList
    plural: dexconnectors
    singular: dexconnector
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.id
      name: ID
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DexConnector registers one upstream identity provider in dex. dex must run
          with DEX_API_CONNECTORS_CRUD=true; connectors affect every login, so
          creating them is usually reserved to platform administrators by RBAC.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DexConnectorSpec describes one upstream identity provider
              dex federates to.
            properties:
              config:
                description: |-
                  Config is the connector type's own configuration, exactly as it would
                  appear under `config:` in dex's config file. Secret values do not
                  belong here; reference them with SecretRefs.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              grantTypes:
                description: |-
                  GrantTypes restricts the OAuth2 grant types this connector may be
                  used with. Empty leaves the connector unrestricted.
                items:
                  enum:
                  - authorization_code
                  - refresh_token
                  - implicit
                  - password
                  - urn:ietf:params:oauth:grant-type:device_code
                  - urn:ietf:params:oauth:grant-type:token-exchange
                  type: string
                maxItems: 8
                type: array
                x-kubernetes-list-type: atomic
              id:
                description: |-
                  ID is the connector ID registered in dex (what DexClient
                  allowedConnectors and dex's login URLs refer to). Defaults to
                  "<namespace>-<name>"; immutable once the object exists.
                maxLength: 253
                minLength: 1
                type: string
              name:
                description: |-
                  Name is the human-readable name dex shows on its login page. Defaults
                  to the object's name.
                maxLength: 253
                type: string
              secretRefs:
                description: SecretRefs merge Secret values into Config before it
                  is sent to dex.
                items:
                  description: ConnectorSecretRef sets one config field from a Secret
                    value.
                  properties:
                    configField:
                      description: |-
                        ConfigField is the dotted path in Config the value is written to:
                        "clientSecret", "bindPW", "nested.key". Intermediate objects are
                        created as needed; a path through a non-object value is an error.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$
                      type: string
                    valueFrom:
                      description: |-
                        ValueFrom is the Secret key, in the DexConnector's namespace, holding
                        the value.
                      properties:
                        key:
                          description: Key within the Secret's data.
                          maxLength: 253
                          minLength: 1
                          type: string
                        name:
                          description: Name of the Secret.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - configField
                  - valueFrom
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - configField
                x-kubernetes-list-type: map
              type:
                description: |-
                  Type is the dex connector type: oidc, github, ldap, saml, microsoft,
                  ... — any type the running dex was built with.
                maxLength: 63
                minLength: 1
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: id is immutable
              rule: has(self.id) == has(oldSelf.id) && (!has(self.id) || self.id ==
                oldSelf.id)
          status:
            description: DexConnectorStatus is the observed state of a DexConnector.
            properties:
              conditions:
                description: Conditions carry the Ready summary.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              id:
                description: ID is the connector ID registered in dex.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the conditions describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
