---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: dexclients.dex.bitwisemedia.uk
spec:
  group: dex.bitwisemedia.uk
  names:
    categories:
    - dex
    kind: DexClient
    listKind: DexClientList
    plural: dexclients
    singular: dexclient
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.clientID
      name: ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DexClient registers one OAuth2 client in dex.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DexClientSpec describes one OAuth2 client registered in dex.
            properties:
              allowedConnectors:
                description: |-
                  AllowedConnectors restricts which dex connector IDs may be used to log
                  in to this client. Empty allows every connector.
                items:
                  maxLength: 253
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              backchannelLogoutURI:
                description: |-
                  BackchannelLogoutURI is where dex POSTs a logout token when a session
                  this client took part in ends (OIDC Back-Channel Logout 1.0).
                maxLength: 2048
                type: string
              clientID:
                description: |-
                  ClientID is the OAuth2 client ID registered in dex. Defaults to
                  "<namespace>-<name>"; immutable once the object exists.
                maxLength: 253
                minLength: 1
                type: string
              generatedSecret:
                description: |-
                  GeneratedSecret configures the Secret the controller generates when
                  SecretRef is unset. The controller owns it (an owner reference ties
                  its lifetime to this object) and writes the keys clientID,
                  clientSecret and, when the controller knows dex's issuer, issuer.
                properties:
                  name:
                    description: Name of the Secret. Defaults to "<name>-dex-client".
                    maxLength: 253
                    minLength: 1
                    type: string
                type: object
              logoURL:
                description: LogoURL is shown on dex's approval screen.
                maxLength: 2048
                type: string
              name:
                description: |-
                  Name is the human-readable client name dex shows on its approval
                  screen.
                maxLength: 253
                type: string
              postLogoutRedirectURIs:
                description: |-
                  PostLogoutRedirectURIs are where the browser may be sent after an
                  RP-initiated logout.
                items:
                  maxLength: 2048
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              public:
                description: |-
                  Public marks a client that cannot keep a secret (a single-page app,
                  a CLI). Public clients have no secret.
                type: boolean
              redirectURIs:
                description: |-
                  RedirectURIs are the callback URLs dex may redirect to after login.
                  Required unless the client is public.
                items:
                  maxLength: 2048
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              refreshTokenLifetime:
                description: |-
                  RefreshTokenLifetime is whether this client's refresh tokens outlive
                  the browser session that issued them ("standalone", dex's default when
                  empty) or end with it ("session").
                enum:
                - ""
                - standalone
                - session
                type: string
              secretRef:
                description: |-
                  SecretRef points at an existing Secret holding the client secret.
                  When unset (and the client is not public) the controller generates a
                  secret instead; see GeneratedSecret.
                properties:
                  key:
                    default: clientSecret
                    description: Key within the Secret's data.
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              trustedPeers:
                description: TrustedPeers are client IDs allowed to mint tokens for
                  this client.
                items:
                  maxLength: 253
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
            type: object
            x-kubernetes-validations:
            - message: clientID is immutable
              rule: has(self.clientID) == has(oldSelf.clientID) && (!has(self.clientID)
                || self.clientID == oldSelf.clientID)
            - message: secretRef must not be set on a public client
              rule: '!((has(self.public) && self.public) && has(self.secretRef))'
            - message: generatedSecret must not be set on a public client
              rule: '!((has(self.public) && self.public) && has(self.generatedSecret))'
            - message: secretRef and generatedSecret are mutually exclusive
              rule: '!(has(self.secretRef) && has(self.generatedSecret))'
            - message: redirectURIs is required unless the client is public
              rule: (has(self.public) && self.public) || (has(self.redirectURIs) &&
                size(self.redirectURIs) > 0)
          status:
            description: DexClientStatus is the observed state of a DexClient.
            properties:
              clientID:
                description: ClientID is the client ID registered in dex.
                type: string
              conditions:
                description: Conditions carry the Ready summary.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation the conditions describe.
                format: int64
                type: integer
              secretName:
                description: |-
                  SecretName is the Secret holding the client secret: SecretRef's, or
                  the generated one. Empty for a public client.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
