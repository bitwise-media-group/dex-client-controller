# Continuous integration — thin caller for the org's reusable ci workflow
# (mise-task aware). It discovers the canonical tasks this repo defines and runs
# `mise run lint` / `build` / `test` as one parallel job each, then Codecov
# uploads from coverage/ — emitted by `mise run test`. `lint` carries all
# check-mode static analysis — golangci-lint, govulncheck, the codegen drift
# check, addlicense, markdownlint, prettier --check, actionlint/zizmor,
# hadolint/grype and helm lint/kubescape — with the pinned tools coming from
# the toolchain submodule at .mise/. `test` runs the envtest suites for real
# (hack/test.sh provisions kube-apiserver/etcd).
#
# e2e: true opts into the reusable workflow's `mise run e2e` job: the e2e/
# module builds a real dex and the controller binary and drives them against an
# envtest kube-apiserver — no cluster, no credentials.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Continuous Integration

on:
    push:
        branches: [main]
    pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
    contents: read

jobs:
    ci:
        uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@437369afd3c617ae0cd06085e281574c7eb560a2 # v8.0.1
        with:
            e2e: true
