apiVersion: v2
name: dex-client-controller
description: >-
    Self-service SSO for dex: namespaced DexClient and DexConnector resources reconciled into a running dex through
    its gRPC API — no config rewrites, no restarts, secrets kept in Kubernetes Secrets.
type: application
# Only Kubernetes lines that have not reached end-of-life are supported.
kubeVersion: ">=1.34.0-0"
home: https://oss.bitwisemedia.uk/dex-client-controller
sources:
    - https://github.com/bitwise-media-group/dex-client-controller
maintainers:
    - name: BitWise Media Group
      url: https://github.com/bitwise-media-group

# Both stamped by release-please (extra-files generic updater, see
# release-please-config.json): the chart version tracks the app release 1:1,
# and the default image tag is v<appVersion>.
version: 0.1.1 # x-release-please-version
appVersion: 0.1.1 # x-release-please-version
