{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ include "dcc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "dcc.labels" . | nindent 8 }}
    {{- with include "dcc.annotations" (dict "root" $ "extra" .Values.serviceAccount.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
{{- end }}
